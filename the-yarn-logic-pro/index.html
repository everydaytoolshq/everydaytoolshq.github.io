  <style>
    :root {
      --primary: #8B5CF6;
      --primary-dark: #6D28D9;
      --accent: #C4B5FD;
      --bg: #f8f5ff;
      --surface: #ffffff;
      --text: #3F2A6B;
      --muted: #6B5A8E;
      --radius: 20px;
      --radius-lg: 28px;
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap { width: min(1280px, 100% - 32px); margin: 0 auto; }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #f3e8ff 0%, #e0d4ff 100%);
      padding: 60px 0 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.8rem, 6vw, 4.2rem);
      font-weight: 800;
      line-height: 1.05;
      color: var(--text);
      margin-bottom: 16px;
    }
    .hero h1 span { color: var(--primary); }
    .hero p {
      font-size: 1.25rem;
      max-width: 620px;
      margin: 0 auto 32px;
      color: var(--muted);
    }

    .hero-image {
      width: 100%;
      max-width: 1340px;
      height: auto;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(139, 92, 246, 0.25);
      margin: 30px auto;
      display: block;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
    }
    .btn-primary:hover { transform: translateY(-4px); box-shadow: 0 15px 40px rgba(139, 92, 246, 0.5); }

    /* Main Content */
    .section { padding: 60px 0; }
    .card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 40px rgba(139, 92, 246, 0.1);
      padding: 32px;
      margin-bottom: 40px;
    }

    h2 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: var(--text);
    }

    /* Form Styling */
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    input, select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #E9D5FF;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 20px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .calculate-btn {
      width: 100%;
      padding: 18px;
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      margin-top: 20px;
      cursor: pointer;
    }

    .results {
      background: #f3e8ff;
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
    }

    /* Footer */
    .siteFooter {
      margin-top: 80px;
      padding: 40px 0 30px;
      border-top: 1px solid #ddd;
      text-align: center;
      font-size: 14px;
      background-color: #f9fafb;
    }

</head>
