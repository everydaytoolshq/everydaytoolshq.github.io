<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Free Meme Generator — Make & Share Memes Instantly</title>
<meta name="description" content="The free online meme maker. Pick a background, type your caption, download or copy." />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "DM Sans", system-ui, sans-serif;
  background: #f7f8fc;
  color: #1a1a2e;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 0 18px; }

/* BREADCRUMB & HERO */
.breadcrumb { padding: 18px 0 0; font-size: 12px; font-weight: 600; color: #888; }
.heroImg { margin: 14px 0 0; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
.heroImg img { width: 100%; height: clamp(200px, 38vw, 420px); object-fit: cover; }

/* HEADER */
.pageHeader { text-align: center; padding: 30px 0 8px; }
.eyebrow {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: #e8375a; background: rgba(232,55,90,.08); border: 1px solid rgba(232,55,90,.22);
  padding: 6px 16px; border-radius: 999px; margin-bottom: 14px;
}
h1 {
  font-family: "Fraunces", Georgia, serif; font-size: clamp(32px, 7vw, 64px); font-weight: 900;
  line-height: 1; letter-spacing: -.02em; margin: 0 0 14px; color: #111;
}
h1 span { color: #e8375a; font-style: italic; }
.intro { font-size: 15px; line-height: 1.8; color: #666; max-width: 560px; margin: 0 auto 26px; }

/* CARD */
.card {
  background: #fff; border: 1px solid #e5e7f0; border-radius: 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,.07); padding: 24px; margin: 0 0 22px;
}
.cardTitle {
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: #999; margin: 0 0 18px; display: flex; align-items: center; gap: 8px;
}
.cardTitle i { color: #e8375a; }
.cardTitle::after { content: ""; flex: 1; height: 1px; background: #eee; }

/* FORM */
.fg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.fg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.fg1 { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 11px; font-weight: 700; color: #888; letter-spacing: .07em; text-transform: uppercase; }

select, input[type="text"], input[type="file"] {
  height: 44px; border: 1.5px solid #e0e3ef; border-radius: 10px; padding: 0 12px;
  font-size: 14px; font-family: inherit; color: #222; background: #f9faff; outline: none;
  transition: border-color .15s, box-shadow .15s; width: 100%;
}
select:focus, input[type="text"]:focus { border-color: #e8375a; box-shadow: 0 0 0 3px rgba(232,55,90,.12); }

/* SLIDERS */
.sliderField > label { font-size: 11px; font-weight: 700; color: #888; letter-spacing: .07em; text-transform: uppercase; display: flex; justify-content: space-between; }
input[type="range"] {
  -webkit-appearance: none; width: 100%; height: 5px;
  background: #e0e3ef; border-radius: 999px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: #e8375a; cursor: pointer; box-shadow: 0 2px 6px rgba(232,55,90,.35);
}

/* COLORS & TOGGLES */
.colorRow { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
.toggleRow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tBtn {
  padding: 9px 14px; border-radius: 10px; border: 1.5px solid #e0e3ef; background: #f9faff;
  color: #666; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
}
.tBtn.on { background: rgba(232,55,90,.08); border-color: #e8375a; color: #e8375a; }

/* CANVAS */
.canvasArea { text-align: center; margin: 0 0 22px; }
#memeCanvas {
  border: 2px solid #e0e3ef; border-radius: 14px; max-width: 100%;
  display: block; margin: 0 auto 16px; background: #000;
  box-shadow: 0 8px 32px rgba(0,0,0,.15);
}

/* ACTION BUTTONS */
.actionRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btnGreen, .btnBlue {
  padding: 13px 28px; border-radius: 12px; border: none;
  font-size: 17px; font-family: "Fraunces", serif; font-weight: 700;
  cursor: pointer; min-height: 50px; display: flex; align-items: center; gap: 8px;
}
.btnGreen { background: #27ae60; color: #fff; }
.btnBlue { background: #0088ff; color: #fff; }

/* TEMPLATES */
.tabRow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tabBtn {
  padding: 7px 14px; border-radius: 8px; border: 1.5px solid #e0e3ef; background: #f9faff;
  color: #777; font-size: 12px; font-weight: 700; cursor: pointer;
}
.tabBtn.active { background: #e8375a; border-color: #e8375a; color: #fff; }

.carouselWrap { position: relative; overflow: hidden; padding: 0 44px; }
.tGrid { display: flex; transition: transform .3s ease-out; will-change: transform; gap: 10px; padding: 4px 0; }
.tItem {
  flex-shrink: 0; width: 130px; height: 100px; border-radius: 10px; overflow: hidden;
  border: 2.5px solid transparent; cursor: pointer; transition: all .2s;
}
.tItem:hover { border-color: #e8375a; transform: translateY(-3px); }
.tItem.sel { border-color: #e8375a; }
.tItem img { width: 100%; height: 100%; object-fit: cover; }

.cBtn {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
  width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid #e0e3ef;
  background: #fff; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.cBtn:hover { background: #e8375a; color: #fff; }

@media (max-width: 680px) {
  .fg2, .fg3 { grid-template-columns: 1fr; }
  .tItem { width: 100px; height: 80px; }
}
@media (max-width: 400px) {
  .tItem { width: 80px; height: 65px; }
}
</style>
</head>
<body>
<div class="wrap">

<nav class="breadcrumb"><a href="https://everydaytoolshq.github.io/">Home</a> › Meme Generator</nav>

<div class="heroImg">
  <img src="https://everydaytoolshq.github.io/memegeneratorhero.jpg" alt="Free Meme Generator" loading="eager" />
</div>

<header class="pageHeader">
  <span class="eyebrow">😂 Free · No Sign-Up · Instant Download</span>
  <h1>Make a <span>Meme</span><br>in Seconds</h1>
  <p class="intro">Pick a template, write your caption, download or copy. Powerful templates included.</p>
</header>

<!-- BUILDER CARD -->
<div class="card">
  <div class="cardTitle"><i class="fas fa-sliders-h"></i> Meme Controls</div>

  <div class="fg2">
    <div class="field">
      <label>Theme / Mood</label>
      <select id="themeSelect">
        <option value="funny">😂 Funny</option>
        <option value="energy">⚡ Energy / Power</option>
        <option value="motivational">💪 Motivational</option>
        <option value="romantic">❤️ Romantic</option>
        <option value="inspirational">✨ Inspirational</option>
        <option value="success">🏆 Success</option>
        <option value="nature">🌿 Nature</option>
        <option value="animals">🐶 Animals</option>
      </select>
    </div>
    <div class="field">
      <label>Caption Starter</label>
      <select id="quoteSelect"></select>
    </div>
  </div>

  <div class="fg1">
    <div class="field">
      <label>Your Custom Caption</label>
      <input type="text" id="customQuote" placeholder="Type your own caption here…" />
    </div>
  </div>

  <div class="fg3">
    <div class="field">
      <label>Font</label>
      <select id="fontSelect">
        <option value="Impact">Impact (Classic Meme)</option>
        <option value="Arial Black">Arial Black</option>
        <option value="Arial">Arial</option>
      </select>
    </div>
    <div class="sliderField">
      <label>Font Size <span id="fontSizeVal">40</span>px</label>
      <input type="range" id="fontSize" min="16" max="80" value="40" />
    </div>
    <div class="sliderField">
      <label>Text Position <span id="textPosVal">0</span></label>
      <input type="range" id="textPosition" min="-160" max="160" value="0" />
    </div>
  </div>

  <div style="margin-bottom:14px;">
    <div class="colorRow">
      <div class="colorField"><label>Text</label><input type="color" id="textColor" value="#ffffff" /></div>
      <div class="colorField"><label>Outline</label><input type="color" id="strokeColor" value="#000000" /></div>
      <div class="colorField"><label>BG Fill</label><input type="color" id="bgColor" value="#000000" /></div>
    </div>
  </div>

  <div class="toggleRow">
    <button class="tBtn on" id="boldToggle"><i class="fas fa-bold"></i> Bold</button>
    <button class="tBtn on" id="outlineToggle"><i class="fas fa-border-style"></i> Outline</button>
    <button class="tBtn" id="glowToggle"><i class="fas fa-lightbulb"></i> Glow</button>
    <button class="tBtn" id="upperToggle"><i class="fas fa-text-height"></i> UPPERCASE</button>
  </div>

  <div class="fg2">
    <div class="field">
      <label>Upload Your Own Image</label>
      <input type="file" id="bgImageUpload" accept="image/*" />
    </div>
    <div class="field">
      <button class="tBtn" id="clearBgBtn"><i class="fas fa-trash"></i> Clear Image</button>
    </div>
  </div>
</div>

<!-- CANVAS -->
<div class="canvasArea">
  <canvas id="memeCanvas"></canvas>
  <div class="actionRow">
    <button class="btnGreen" id="downloadBtn"><i class="fas fa-download"></i> Download Meme</button>
    <button class="btnBlue" id="copyBtn"><i class="fas fa-copy"></i> Copy to Clipboard</button>
  </div>
</div>

<!-- TEMPLATES -->
<div class="card">
  <div class="cardTitle"><i class="fas fa-images"></i> Background Templates — click any to apply</div>
  <div class="tabRow" id="tabRow">
    <button class="tabBtn active" data-cat="all">All</button>
    <button class="tabBtn" data-cat="energy">⚡ Energy</button>
    <button class="tabBtn" data-cat="nature">🌿 Nature</button>
    <button class="tabBtn" data-cat="romantic">❤️ Romance</button>
    <button class="tabBtn" data-cat="animals">🐶 Animals</button>
  </div>
  <div class="carouselWrap">
    <button class="cBtn prev" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
    <div class="tGrid" id="tGrid"></div>
    <button class="cBtn next" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
  </div>
</div>

</div>

<script>
// ==================== THEMES ====================
var themes = {
  funny: ["I don't always make memes. But when I do, I make them badly.","My brain has too many tabs open.","This is fine. Everything is fine."],
  energy: ["Feel the power. Share the energy.","Charge up, rise up!","Unleash your inner spark.","Power flows where focus goes."],
  motivational: ["You didn't come this far to only come this far.","The comeback is always stronger than the setback."],
  romantic: ["You're the only notification I actually want.","You make ordinary days feel worth writing home about."],
  inspirational: ["The life you want is on the other side of fear.","Bloom where you are planted."],
  nature: ["Nature doesn't hurry, yet everything gets done.","Be like water. Adapt. Flow. Persist."],
  animals: ["This is my dog. He knows what he did.","My cat judging me for my life choices."],
  success: ["They said it couldn't be done. I took that personally.","Success looks like what they called boring."]
};

// ==================== RICH TEMPLATES FROM CODE 2 ====================
var TEMPLATES = [
  {cat:"energy",label:"Lightning",t:"https://images.unsplash.com/photo-1548475390-f6908921aaf8?w=200&q=60",f:"https://images.unsplash.com/photo-1548475390-f6908921aaf8?w=800&q=80"},
  {cat:"energy",label:"Fire",t:"https://images.unsplash.com/photo-1513758173941-bfbd2e4166f5?w=200&q=60",f:"https://images.unsplash.com/photo-1513758173941-bfbd2e4166f5?w=800&q=80"},
  {cat:"energy",label:"Storm",t:"https://images.unsplash.com/photo-1498673394965-85cb14905c89?w=200&q=60",f:"https://images.unsplash.com/photo-1498673394965-85cb14905c89?w=800&q=80"},
  {cat:"energy",label:"Neon City",t:"https://images.unsplash.com/photo-1563761141-38f17aad6d44?w=200&q=60",f:"https://images.unsplash.com/photo-1563761141-38f17aad6d44?w=800&q=80"},
  {cat:"energy",label:"Sparks",t:"https://images.unsplash.com/photo-1631830729777-b89d676ef54f?w=200&q=60",f:"https://images.unsplash.com/photo-1631830729777-b89d676ef54f?w=800&q=80"},
  {cat:"nature",label:"Mountains",t:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=200&q=60",f:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&q=80"},
  {cat:"nature",label:"Ocean",t:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200&q=60",f:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80"},
  {cat:"nature",label:"Forest",t:"https://images.unsplash.com/photo-1511497584788-876760111969?w=200&q=60",f:"https://images.unsplash.com/photo-1511497584788-876760111969?w=800&q=80"},
  {cat:"romantic",label:"Couple Walk",t:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=200&q=60",f:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800&q=80"},
  {cat:"romantic",label:"Sunset",t:"https://images.unsplash.com/photo-1444157545135-c045be691b05?w=200&q=60",f:"https://images.unsplash.com/photo-1444157545135-c045be691b05?w=800&q=80"},
  {cat:"animals",label:"Golden Dog",t:"https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?w=200&q=60",f:"https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?w=800&q=80"},
  {cat:"animals",label:"Shocked Dog",t:"https://images.unsplash.com/photo-1517849845537-4d257902454a?w=200&q=60",f:"https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800&q=80"},
  {cat:"animals",label:"Grumpy Cat",t:"https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=200&q=60",f:"https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=800&q=80"}
  // You can add more from Code 2 if needed
];

// ==================== CANVAS & LOGIC (from Code 1) ====================
var canvas = document.getElementById("memeCanvas");
var ctx = canvas.getContext("2d");

function setCanvasSize() {
  var w = window.innerWidth;
  if (w <= 400) { canvas.width = 300; canvas.height = 225; }
  else if (w <= 600) { canvas.width = 400; canvas.height = 300; }
  else { canvas.width = 600; canvas.height = 400; }
  drawMeme();
}
setCanvasSize();
window.addEventListener("resize", setCanvasSize);

// State
var isBold = true, isOutline = true, glowOn = false, isUpper = false;
var bgImage = null;

// Initialize Quotes
var qSel = document.getElementById("quoteSelect");
var thSel = document.getElementById("themeSelect");

function initQuotes(th) {
  qSel.innerHTML = "";
  var list = themes[th] || themes.funny;
  list.forEach(quote => {
    var o = document.createElement("option");
    o.textContent = quote;
    qSel.appendChild(o);
  });
  drawMeme();
}
thSel.addEventListener("change", () => initQuotes(thSel.value));
initQuotes("energy");

// Draw Function
function drawMeme() {
  var customVal = document.getElementById("customQuote").value.trim();
  var text = customVal || qSel.value;
  if (!text) return;
  if (isUpper) text = text.toUpperCase();

  var fs = parseInt(document.getElementById("fontSize").value);
  var fn = document.getElementById("fontSelect").value;
  var fw = isBold ? "bold" : "normal";
  var va = parseInt(document.getElementById("textPosition").value);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = document.getElementById("bgColor").value;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (bgImage) {
    var ia = bgImage.width / bgImage.height;
    var ca = canvas.width / canvas.height;
    var dw, dh, ox, oy;
    if (ia > ca) { dh = canvas.height; dw = dh * ia; ox = (canvas.width - dw) / 2; oy = 0; }
    else { dw = canvas.width; dh = dw / ia; ox = 0; oy = (canvas.height - dh) / 2; }
    ctx.drawImage(bgImage, ox, oy, dw, dh);
  }

  ctx.font = fw + " " + fs + "px \"" + fn + "\"";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  var maxW = canvas.width * 0.88;
  var lh = fs * 1.28;
  var lines = wrapText(ctx, text, maxW);
  var totH = lines.length * lh;
  var tY = (canvas.height / 2) + va;

  ctx.save();
  if (glowOn) { ctx.shadowBlur = 22; ctx.shadowColor = document.getElementById("textColor").value; }

  for (var j = 0; j < lines.length; j++) {
    var ly = tY - (totH / 2) + (j * lh) + lh / 2;
    if (isOutline) {
      ctx.strokeStyle = document.getElementById("strokeColor").value;
      ctx.lineWidth = Math.max(2, fs * 0.065);
      ctx.lineJoin = "round";
      ctx.strokeText(lines[j], canvas.width / 2, ly);
    }
    ctx.fillStyle = document.getElementById("textColor").value;
    ctx.fillText(lines[j], canvas.width / 2, ly);
  }
  ctx.restore();
}

function wrapText(ctx, text, maxW) {
  var words = text.split(" ");
  var lines = [];
  var cur = words[0] || "";
  for (var i = 1; i < words.length; i++) {
    var test = cur + " " + words[i];
    if (ctx.measureText(test).width <= maxW) cur = test;
    else { lines.push(cur); cur = words[i]; }
  }
  lines.push(cur);
  return lines;
}

// Event Listeners (simplified version)
document.getElementById("customQuote").addEventListener("input", drawMeme);
qSel.addEventListener("change", () => { document.getElementById("customQuote").value = ""; drawMeme(); });

["fontSelect","textColor","strokeColor","bgColor","fontSize","textPosition"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    if (id === "fontSize") document.getElementById("fontSizeVal").textContent = document.getElementById(id).value;
    if (id === "textPosition") document.getElementById("textPosVal").textContent = document.getElementById(id).value;
    drawMeme();
  });
});

document.getElementById("boldToggle").addEventListener("click", function() {
  isBold = !isBold; this.classList.toggle("on", isBold); drawMeme();
});
document.getElementById("outlineToggle").addEventListener("click", function() {
  isOutline = !isOutline; this.classList.toggle("on", isOutline); drawMeme();
});
document.getElementById("glowToggle").addEventListener("click", function() {
  glowOn = !glowOn; this.classList.toggle("on", glowOn); drawMeme();
});
document.getElementById("upperToggle").addEventListener("click", function() {
  isUpper = !isUpper; this.classList.toggle("on", isUpper); drawMeme();
});

// Upload & Clear
document.getElementById("bgImageUpload").addEventListener("change", function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = () => { bgImage = img; drawMeme(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
document.getElementById("clearBgBtn").addEventListener("click", () => {
  bgImage = null;
  document.getElementById("bgImageUpload").value = "";
  drawMeme();
});

// Download & Copy
document.getElementById("downloadBtn").addEventListener("click", () => {
  var a = document.createElement("a");
  a.download = "meme-" + Date.now() + ".jpg";
  a.href = canvas.toDataURL("image/jpeg", 0.93);
  a.click();
});

document.getElementById("copyBtn").addEventListener("click", () => {
  canvas.toBlob(blob => {
    navigator.clipboard.write([new ClipboardItem({"image/png": blob})]).then(() => {
      alert("✅ Meme copied to clipboard!");
    });
  });
});

// Templates Carousel (simplified but functional)
var tGrid = document.getElementById("tGrid");
function renderTemplates() {
  tGrid.innerHTML = "";
  TEMPLATES.forEach(img => {
    var item = document.createElement("div");
    item.className = "tItem";
    item.innerHTML = `<img src="${img.t}" alt="${img.label}">`;
    item.onclick = () => {
      var fullImg = new Image();
      fullImg.onload = () => { bgImage = fullImg; drawMeme(); };
      fullImg.src = img.f;
    };
    tGrid.appendChild(item);
  });
}
renderTemplates();

drawMeme();
</script>
</body>
</html>
